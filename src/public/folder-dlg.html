<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Classic Folder Dialog</title>
  <style>
    body {
      font-family: "Tahoma", "MS Sans Serif", Arial, sans-serif;
      font-size: 13px;
      background-color: #3a6ea5;
      padding: 40px;
    }

    .main-box {
      background: #ece9d8;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      padding: 15px;
      width: 440px;
    }

    input[type="text"], select {
      padding: 3px 5px;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      background: #fff;
      font-family: inherit;
      font-size: 12px;
    }

    #resultInput { width: 300px; }

    button {
      background: #ece9d8;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:active {
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 5px 9px 3px 11px;
    }

    dialog {
      padding: 2px;
      background: #ece9d8;
      border: 2px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      width: 440px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.25); }

    .title-bar {
      background: linear-gradient(90deg, #0058e6 0%, #2788ff 100%);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .close-btn {
      background: #e04338;
      color: white;
      border: 1px solid #fff;
      padding: 0 5px;
      font-weight: bold;
      line-height: 16px;
    }

    .dialog-body { padding: 12px; }

    .path-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      align-items: center;
    }
    #driveSelect { width: 65px; }
    #pathInput { flex: 1; }

    .folder-list {
      background: #ffffff;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      height: 210px;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 2px;
      user-select: none;
    }
    .folder-list li {
      padding: 3px 6px;
      cursor: default;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .folder-list li.selected {
      background-color: #316ac5;
      color: white;
    }

    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .dialog-footer button { min-width: 75px; }
  </style>
</head>
<body>

  <div class="main-box">
    <label><strong>Cartella di destinazione:</strong></label><br><br>
    <input type="text" id="resultInput" readonly placeholder="Nessuna cartella selezionata">
    <button id="openDialogBtn">Sfoglia...</button>
  </div>

  <dialog id="folderDialog">
    <div class="title-bar">
      <span>Sfoglia per cartelle</span>
      <button class="close-btn" id="closeXBtn">✕</button>
    </div>

    <div class="dialog-body">
      <div class="path-bar">
        <select id="driveSelect" title="Seleziona unità"></select>
        <input type="text" id="pathInput" placeholder="Inserisci percorso...">
        <button id="goBtn" title="Vai al percorso">Vai</button>
        <button id="upBtn" title="Cartella superiore">⬆ Su</button>
      </div>

      <ul class="folder-list" id="folderList"></ul>

      <div class="dialog-footer">
        <button id="okBtn">OK</button>
        <button id="cancelBtn">Annulla</button>
      </div>
    </div>
  </dialog>

  <script>
    const dialog = document.getElementById('folderDialog');
    const folderList = document.getElementById('folderList');
    const pathInput = document.getElementById('pathInput');
    const driveSelect = document.getElementById('driveSelect');
    const resultInput = document.getElementById('resultInput');

    let currentDir = '';
    let parentDir = '';
    let selectedFolder = null;

    // Carica i dischi disponibili nel menu a tendina
    async function loadDrives() {
      const drivers = [];
      for (let d =67; d<=90; d++) {
        const drive = String.fromCharCode(d) + ':';
        drivers.push(drive);
      }
      // const drivers = ['C:', 'D:', 'E:',"F:",]; // Esempio di dischi disponibili
      driveSelect.innerHTML = '';
      drivers.forEach(drive => {
        const opt = document.createElement('option');
        opt.value = drive;
        opt.textContent = drive+"\\";
        driveSelect.appendChild(opt);
      });
    }

    // Carica le cartelle del percorso scelto
    async function loadFolders(dirPath = '') {
      const url = dirPath ? `/api/folders?path=${encodeURIComponent(dirPath)}` : '/api/folders';
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        alert(data.error);
        pathInput.value = currentDir; // Ripristina il percorso valido precedente
        return;
      }

      currentDir = data.currentPath;
      parentDir = data.parentPath;
      selectedFolder = null;
      pathInput.value = currentDir;

      // Sincronizza il menu a tendina dei dischi con il percorso attuale
      const matchingDrive = Array.from(driveSelect.options).find(opt =>
        currentDir.toUpperCase().startsWith(opt.value.toUpperCase())
      );
      if (matchingDrive) driveSelect.value = matchingDrive.value;

      folderList.innerHTML = '';

      data.folders.forEach(folder => {
        const li = document.createElement('li');
        li.textContent = `📁 ${folder.name}`;

        // 1 clic: seleziona la cartella e aggiorna la casella del percorso
        li.onclick = () => {
          document.querySelectorAll('.folder-list li').forEach(el => el.classList.remove('selected'));
          li.classList.add('selected');
          selectedFolder = folder;
          pathInput.value = folder.fullPath;
        };

        // 2 clic: entra nella cartella
        li.ondblclick = () => loadFolders(folder.fullPath);

        folderList.appendChild(li);
      });
    }

    // Cambio disco dal menu a tendina
    driveSelect.onchange = () => loadFolders(driveSelect.value);

    // Navigazione manuale dalla casella di testo (pulsante Vai o tasto Invio)
    document.getElementById('goBtn').onclick = () => loadFolders(pathInput.value);
    pathInput.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadFolders(pathInput.value);
      }
    };

    // Apertura dialog
    document.getElementById('openDialogBtn').onclick = async () => {
      if (driveSelect.options.length === 0) await loadDrives();
      await loadFolders(currentDir);
      dialog.showModal();
    };

    document.getElementById('upBtn').onclick = () => {
      if (parentDir && parentDir !== currentDir) loadFolders(parentDir);
    };

    // Conferma selezione (restituisce il solo nome della cartella come richiesto all'inizio)
    document.getElementById('okBtn').onclick = () => {
      const targetFull = selectedFolder ? selectedFolder.fullPath : currentDir;
      // Estrae il nome della cartella finale (o la lettera del disco se è la radice)
      const folderName = targetFull.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || targetFull;
      resultInput.value = folderName;
      dialog.close();
    };

    document.getElementById('cancelBtn').onclick = () => dialog.close();
    document.getElementById('closeXBtn').onclick = () => dialog.close();
  </script>

</body>
</html>
