# livello di log: DEBUG, INFO, ERROR
LogLevel=INFO
# Configurazione interfaccia grafica
# comandi principali (sempre visibili)
# il pulsante Stop e gestito a runtime nel pannello avanzamento
ComandiNormali="Scansione,Visualizza,Copia,Esci"
WrapperNormali="Scansione,Visualizza,Copia,Esci"

# comandi avanzati (menu dedicato)
ComandiAvanzati="EditProfile,Ripara path duplicati,CheckDB copiate"
WrapperAvanzati="EditProfile,RiparaDuplicatiPath,CheckDBCopiate"

# legacy (fallback compatibilita)
Comandi="EditProfile,Scansione,Visualizza,Copia,Esci"
Wrapper="EditProfile,Scansione,Visualizza,Copia,Esci"
# font da utilizzare per tutti i componenti grafici
Font=Arial,10
# Profilo attivo
ActiveProfile=Patty
